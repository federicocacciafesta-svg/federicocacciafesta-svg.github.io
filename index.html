.topic-paths{position:absolute;inset:0;height:100%;width:100%;overflow:visible;pointer-events:none;opacity:.65;z-index:0}

.topic-node{--diam:160px;--tint:rgba(204,230,224,.67);--edge:rgba(73,135,133,.35);position:absolute;z-index:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px;width:var(--diam);height:var(--diam);border-radius:50%;background:var(--tint);border:1px solid var(--edge);box-shadow:0 11px 25px rgba(27,69,72,.038),inset 0 0 28px rgba(255,255,255,.32);text-align:center;color:#244b52;font-weight:600;font-size:15px;line-height:1.23;letter-spacing:-.017em;transform:translate(-50%,-50%);transition:background-color .24s,box-shadow .24s,transform .24s,border-color .24s;backdrop-filter:blur(1px)}
.topic-node:hover,.topic-node:focus-visible{background:#dcefeb;border-color:#537e80;box-shadow:0 13px 35px rgba(32,84,82,.15);transform:translate(-50%,-50%) scale(1.05);z-index:4}
.topic-icon{font:italic 27px/1 var(--serif);font-weight:400;color:#51827e;display:block;margin-bottom:3px}
.topic-dirac{left:25.5%;top:43.3%;--diam:225px;--tint:rgba(200,228,221,.76)}

/* Research theme visual alternatives, revision 5 preview */
.alt-topics{padding-bottom:76px}
.alt-topics .topics-heading{margin-bottom:30px}
.variant-toolbar{display:flex;gap:7px;flex-wrap:wrap;border-bottom:1px solid #dbe3e1;padding-bottom:18px}
.variant-button{border:1px solid #e3e8e5;background:transparent;color:#758786;font:600 13px/1.2 var(--sans);padding:12px 15px;cursor:pointer;border-radius:3px;transition:background .18s,color .18s,border-color .18s;}
.variant-button:hover,.variant-button:focus-visible{color:#20464d;border-color:#7d9e9b}
.variant-button.active{background:#25424b;color:#fff;border-color:#25424b}
.variant-no{font:500 10px/1 var(--sans);letter-spacing:.11em;opacity:.66;margin-right:7px}
.variant-caption{padding-top:16px;color:#708481;font:400 13px/1.5 var(--sans);min-height:38px}
.variant-stage{height:505px;position:relative;width:min(100%,1030px);margin:5px auto 0}
.topic-variant{display:none;position:absolute;inset:0;isolation:isolate}
.variant-stage[data-active-viz="network"] [data-variant="network"],.variant-stage[data-active-viz="orbit"] [data-variant="orbit"],.variant-stage[data-active-viz="type"] [data-variant="type"]{display:block}
.variant-endnote{text-align:right;color:#91a19e;font-size:11px;margin:5px 0 0}
.topic-variant a:focus-visible{outline:2px solid #c46a40;outline-offset:5px}
/* Variant 1. Discrete research graph */
.viz-network{background:radial-gradient(ellipse at 50% 58%,rgba(231,238,232,.38),transparent 57%)}
.network-lines{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.network-lines path{fill:none;stroke:#b6c8c3;stroke-width:1.4;vector-effect:non-scaling-stroke}
.network-coordinate{position:absolute;font-size:10px;letter-spacing:.14em;color:#92a4a0;z-index:1}
.network-coordinate-a{top:8%;left:2%}.network-coordinate-b{bottom:7%;right:3%}
.network-node{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;border-radius:100%;width:134px;height:134px;border:1px solid #9ebcb6;background:#fff;color:#294e53;text-align:center;line-height:1.22;box-shadow:0 3px 12px rgba(25,60,60,.035);transition:transform .2s,box-shadow .2s,border-color .2s}
.network-node .the-glyph{font:italic 27px/1 var(--serif);color:#5b8a82}
.network-node .the-caption{font-size:13px;font-weight:600}
.network-node:hover{transform:translate(-50%,-50%) scale(1.07);box-shadow:0 12px 32px #264d4d24;border-color:#436c68;z-index:3}
.network-dispersive{left:49.3%;top:50.2%;width:181px;height:181px;background:#e7f0ed;border-color:#739d97;z-index:2}
.network-dispersive .the-caption{font-size:15px}.network-dirac{left:20.2%;top:36.1%}.network-manifolds{left:79.1%;top:24.6%}.network-nonlinear{left:78.5%;top:73.0%}.network-measures{left:33%;top:80.4%;background:#faf6ef;border-color:#d6c6b5}.network-harmonic{left:17.4%;top:68.0%}
/* Variant 2. Geometric orbital diagram */
.viz-orbits{background:linear-gradient(180deg,#f8faf8 0%,#fff 95%)}
.orbit-lines{position:absolute;inset:0;width:100%;height:100%;fill:none}
.orbit-lines ellipse{stroke:#bbcfc9;stroke-width:1.1;stroke-dasharray:3 7}
.orbit-lines .axis{stroke:#dde6e2;stroke-width:.8;stroke-dasharray:3 9}
.orbit-lines .axis-dot{stroke:none;fill:#91ada8}
.orbit-lines .short-tick{stroke:#93aba6;stroke-width:1.4}
.orbit-center{position:absolute;left:50%;top:49%;transform:translate(-50%,-50%);text-align:center;color:#2b454d;display:flex;flex-direction:column;gap:8px;align-items:center;width:260px}
.orbit-center>span{font:400 13px/1.2 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:#839791}
.orbit-center>strong{font:italic 38px/1.05 var(--serif);font-weight:400;letter-spacing:-.02em}
.orbit-center>small{font:400 11px/1.5 var(--sans);color:#8d9f99;max-width:170px}
.orbit-topic{position:absolute;transform:translate(-50%,-50%);z-index:1;display:flex;flex-direction:column;gap:2px;align-items:center;background:#fff;min-width:126px;padding:12px 14px;text-align:center;color:#36585b;font:600 13px/1.24 var(--sans);border-radius:40px;border:1px solid #e3eae5;box-shadow:0 7px 17px #1735380a;transition:color .18s,border-color .18s,transform .18s}
.orbit-topic:hover{color:#b56842;border-color:#c2aea1;transform:translate(-50%,-50%) scale(1.045)}
.orbit-topic .the-glyph{color:#8ab4a6;font:italic 20px/1 var(--serif)}
.orbit-dirac{left:16%;top:28%}.orbit-dispersive{left:38%;top:12%}.orbit-manifolds{left:78%;top:22%}.orbit-nonlinear{left:85%;top:69%}.orbit-measures{left:54%;top:88%}.orbit-harmonic{left:15%;top:73%}
/* Variant 3. Staggered editorial map */
.viz-type{background:linear-gradient(105deg,#fbfaf7 0%,#f5f8f5 52%,#fff 100%);overflow:hidden}
.typography-kicker{position:absolute;top:8%;left:5%;font:600 10px/1 var(--sans);color:#81978e;letter-spacing:.2em}
.type-lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.type-lines path{stroke:#c9d8cf;stroke-width:1.5;fill:none;stroke-dasharray:2 9}
.type-topic{position:absolute;display:flex;align-items:baseline;gap:8px;color:#2c454e;transform:translateY(0);transition:color .2s,transform .2s}
.type-topic:hover{color:#aa6b46;transform:translateY(-3px)}
.type-title{font:normal clamp(24px,3.1vw,41px)/1.09 var(--serif);letter-spacing:-.035em}
.type-index{font:500 10px/1 var(--sans);color:#a9b9b1;align-self:flex-start;padding-top:8px}
.type-arrow{font:400 15px/1 var(--sans);color:#89a39a;align-self:flex-start;padding-top:7px}
.type-dirac{left:6%;top:21%}.type-dispersive{left:46%;top:16%}.type-manifolds{left:16%;top:43%}.type-nonlinear{left:52%;top:51%}.type-measures{left:6%;top:70%}.type-harmonic{left:60%;top:76%}
.type-footnote{position:absolute;bottom:4%;left:6%;font:italic 15px/1.4 var(--serif);color:#81968b}
@media(max-width:800px){

  .type-title{font-size:clamp(20px,6vw,31px)}.typography-kicker{top:6%;left:4%}.type-topic{gap:5px}.type-index{font-size:9px}.type-arrow{font-size:12px}
  .type-dirac{left:5%;top:18%}.type-dispersive{left:15%;top:32%}.type-manifolds{left:9%;top:47%}.type-nonlinear{left:15%;top:62%}.type-measures{left:7%;top:77%}.type-harmonic{left:28%;top:90%}

function contact(){return `${lead('Contact','I am based in the Department of Mathematics “Tullio Levi-Civita” at the University of Padova.','Get in touch')}<div class="page-main"><div class="container contact-layout"><div><div class="eyebrow">Correspondence</div><h2 class="contact-title">Find me in<br><em>Padova.</em></h2><p class="contact-intro">For academic correspondence, please use my university email address. You can also find my official faculty profile and research record through the links below.</p><a class="contact-email" href="mailto:${esc(D.email)}">${esc(D.email)} <span aria-hidden="true">↗</span></a><div class="external-badges">${ext(D.profile,'University profile ↗')}${ext(D.archive,'Research archive ↗')}</div></div><div class="contact-card"><div class="item"><div class="label">Department</div><div class="val">Department of Mathematics “Tullio Levi-Civita”<br>University of Padova</div></div><div class="item"><div class="label">Address</div><div class="val">Via Trieste 63<br>35131 Padova, Italy</div></div><div class="item"><div class="label">Office</div><div class="val">Room 6AB3 · Torre Archimede</div></div><div class="item"><div class="label">Phone</div><div class="val">+39 049 827 1486</div></div><div class="item"><div class="label">Curriculum vitae (PDF)</div><div class="val"><a href="${CV_FILE}" download="Federico_Cacciafesta_CV_EN.pdf">Download CV in English ↓</a></div></div></div></div></div>`;}
function render(){header();footer();const p=route();const make={home,research,publications,teaching,contact};document.getElementById('app').innerHTML=`<div class="fade-in">${make[p]()}</div>`;document.title=`${p==='home'?'Federico Cacciafesta':names[p]+' | Federico Cacciafesta'} — University of Padova`;if(p==='publications')bindPublications();let selected='';if(p==='research'){selected=IS_PREVIEW?(new URLSearchParams((location.hash.split('?')[1]||''))).get('topic')||'':((location.hash||'').match(/^#topic-(dirac|manifolds|nonlinear|harmonic|measures)$/)||[])[1]||'';}if(selected){const target=document.getElementById('topic-'+selected);if(target){requestAnimationFrame(()=>target.scrollIntoView({block:'center',behavior:'instant'}));}else{window.scrollTo({top:0,behavior:'instant'});}}else{window.scrollTo({top:0,behavior:'instant'});}}
window.addEventListener('hashchange',render);render();
})();
